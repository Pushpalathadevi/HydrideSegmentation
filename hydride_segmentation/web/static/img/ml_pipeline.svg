<svg xmlns="http://www.w3.org/2000/svg" width="520" height="828" viewBox="0 0 520 828"
     role="img" aria-labelledby="ml-title ml-desc" font-family="'Segoe UI',Arial,Helvetica,sans-serif">
  <title id="ml-title">Trained model segmentation pipeline</title>
  <desc id="ml-desc">
    Flow chart. Start, then read the micrograph and build a normalised RGB tensor. The encoder
    applies double convolution blocks separated by max pooling. The decoder upsamples and
    concatenates the matching encoder features. A one by one convolution produces one logit per
    pixel, and the logistic function converts it to a probability. A decision on whether the
    probability exceeds one half labels each pixel hydride or background. Both paths rejoin to
    produce the binary mask, and the chart ends.
  </desc>

  <defs>
    <linearGradient id="m-panel" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f5f7fc"/><stop offset="1" stop-color="#e9eef8"/>
    </linearGradient>
    <linearGradient id="m-term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd88f"/><stop offset="1" stop-color="#f2ad35"/>
    </linearGradient>
    <linearGradient id="m-proc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e9fb"/><stop offset="1" stop-color="#a9cbea"/>
    </linearGradient>
    <linearGradient id="m-net" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2dcf8"/><stop offset="1" stop-color="#bfb2ea"/>
    </linearGradient>
    <linearGradient id="m-dec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4ecab"/><stop offset="1" stop-color="#8fd06e"/>
    </linearGradient>
    <filter id="m-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#1d3348" flood-opacity="0.28"/>
    </filter>
    <marker id="m-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f4257"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="508" height="816" rx="14" fill="url(#m-panel)" stroke="#ccd6ea"/>

  <text x="260" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#17293c">
    Trained model pipeline
  </text>
  <text x="260" y="56" text-anchor="middle" font-size="11.5" fill="#5a6b7c">
    U-Net convolutional network &#183; nothing to tune at run time
  </text>

  <g stroke="#2f4257" stroke-width="1.6" fill="none" marker-end="url(#m-arrow)">
    <path d="M260 110 V130"/>
    <path d="M260 178 V200"/>
    <path d="M260 264 V286"/>
    <path d="M260 350 V372"/>
    <path d="M260 410 V432"/>
    <path d="M260 470 V492"/>
    <path d="M260 676 V706"/>
    <path d="M260 754 V774"/>
  </g>

  <g stroke="#2f4257" stroke-width="1.6" fill="none">
    <path d="M160 530 H116 V576" marker-end="url(#m-arrow)"/>
    <path d="M360 530 H404 V576" marker-end="url(#m-arrow)"/>
    <path d="M116 628 V676 H260"/>
    <path d="M404 628 V676 H260"/>
  </g>

  <!-- skip-connection hint from encoder to decoder -->
  <g stroke="#7c6bc4" stroke-width="1.4" fill="none" stroke-dasharray="5 4">
    <path d="M126 240 H70 V318 H124" marker-end="url(#m-arrow)"/>
  </g>
  <text x="63" y="272" text-anchor="end" font-size="9.5" font-weight="650" fill="#5a4aa8">skip</text>
  <text x="63" y="284" text-anchor="end" font-size="9.5" font-weight="650" fill="#5a4aa8">features</text>

  <!-- Start -->
  <g filter="url(#m-shadow)">
    <rect x="200" y="76" width="120" height="34" rx="17" fill="url(#m-term)" stroke="#d19a28" stroke-width="1.4"/>
  </g>
  <text x="260" y="98" text-anchor="middle" font-size="13" font-weight="650" fill="#4a3208">Start</text>

  <!-- Tensor -->
  <g filter="url(#m-shadow)">
    <rect x="140" y="130" width="240" height="48" rx="3" fill="url(#m-proc)" stroke="#4c7fb2" stroke-width="1.4"/>
  </g>
  <text x="260" y="148" text-anchor="middle" font-size="12" fill="#15293d">Build normalised RGB tensor</text>
  <text x="260" y="165" text-anchor="middle" font-size="12"
        font-family="Georgia,'Times New Roman',serif" font-style="italic" fill="#15293d">
    x &#8592; I<tspan baseline-shift="sub" font-size="9" font-style="normal">RGB</tspan> / 255,
    shape (1, 3, H, W)
  </text>

  <!-- Encoder -->
  <g filter="url(#m-shadow)">
    <rect x="126" y="200" width="268" height="64" rx="3" fill="url(#m-net)" stroke="#7c6bc4" stroke-width="1.4"/>
  </g>
  <text x="260" y="219" text-anchor="middle" font-size="12" font-weight="650" fill="#241a4a">Encoder &#183; contracting path</text>
  <text x="260" y="236" text-anchor="middle" font-size="11.5" fill="#241a4a">DC(3&#8594;C) &#8594; pool &#8594; DC(C&#8594;2C)</text>
  <text x="260" y="252" text-anchor="middle" font-size="11.5" fill="#241a4a">&#8594; pool &#8594; DC(2C&#8594;4C)</text>

  <!-- Decoder -->
  <g filter="url(#m-shadow)">
    <rect x="126" y="286" width="268" height="64" rx="3" fill="url(#m-net)" stroke="#7c6bc4" stroke-width="1.4"/>
  </g>
  <text x="260" y="305" text-anchor="middle" font-size="12" font-weight="650" fill="#241a4a">Decoder &#183; expanding path</text>
  <text x="260" y="322" text-anchor="middle" font-size="11.5" fill="#241a4a">up(4C&#8594;2C) &#8853; skip &#8594; DC</text>
  <text x="260" y="338" text-anchor="middle" font-size="11.5" fill="#241a4a">up(2C&#8594;C) &#8853; skip &#8594; DC</text>

  <!-- Head -->
  <g filter="url(#m-shadow)">
    <rect x="140" y="372" width="240" height="38" rx="3" fill="url(#m-net)" stroke="#7c6bc4" stroke-width="1.4"/>
  </g>
  <text x="260" y="396" text-anchor="middle" font-size="12" fill="#241a4a">1&#215;1 convolution &#8594; logit
    <tspan font-family="Georgia,'Times New Roman',serif" font-style="italic"> z</tspan>
  </text>

  <!-- Sigmoid -->
  <g filter="url(#m-shadow)">
    <rect x="140" y="432" width="240" height="38" rx="3" fill="url(#m-proc)" stroke="#4c7fb2" stroke-width="1.4"/>
  </g>
  <text x="260" y="456" text-anchor="middle" font-size="12.5"
        font-family="Georgia,'Times New Roman',serif" font-style="italic" fill="#15293d">
    p &#8592; &#963;(z) = 1 / (1 + e<tspan baseline-shift="super" font-size="9">&#8722;z</tspan>)
  </text>

  <!-- Decision -->
  <g filter="url(#m-shadow)">
    <path d="M260 492 L360 530 L260 568 L160 530 Z" fill="url(#m-dec)" stroke="#5c9f3f" stroke-width="1.4"/>
  </g>
  <text x="260" y="527" text-anchor="middle" font-size="12" fill="#16300a">Is
    <tspan font-family="Georgia,'Times New Roman',serif" font-style="italic"> p</tspan> &gt; 0.5
  </text>
  <text x="260" y="541" text-anchor="middle" font-size="12" fill="#16300a">for this pixel?</text>

  <text x="130" y="522" font-size="10.5" font-weight="700" fill="#2d6a17">TRUE</text>
  <text x="368" y="522" font-size="10.5" font-weight="700" fill="#a33b2a">FALSE</text>

  <!-- TRUE branch -->
  <g filter="url(#m-shadow)">
    <rect x="18" y="576" width="196" height="52" rx="3" fill="url(#m-proc)" stroke="#4c7fb2" stroke-width="1.4"/>
  </g>
  <text x="116" y="598" text-anchor="middle" font-size="11.5" fill="#15293d">Label pixel as hydride</text>
  <text x="116" y="615" text-anchor="middle" font-size="12"
        font-family="Georgia,'Times New Roman',serif" font-style="italic" fill="#15293d">M(x,y) &#8592; 1</text>

  <!-- FALSE branch -->
  <g filter="url(#m-shadow)">
    <rect x="306" y="576" width="196" height="52" rx="3" fill="url(#m-proc)" stroke="#4c7fb2" stroke-width="1.4"/>
  </g>
  <text x="404" y="598" text-anchor="middle" font-size="11.5" fill="#15293d">Label pixel as background</text>
  <text x="404" y="615" text-anchor="middle" font-size="12"
        font-family="Georgia,'Times New Roman',serif" font-style="italic" fill="#15293d">M(x,y) &#8592; 0</text>

  <circle cx="260" cy="676" r="3.4" fill="#2f4257"/>

  <!-- Mask -->
  <g filter="url(#m-shadow)">
    <rect x="126" y="706" width="268" height="48" rx="3" fill="url(#m-proc)" stroke="#4c7fb2" stroke-width="1.4"/>
  </g>
  <text x="260" y="724" text-anchor="middle" font-size="12" fill="#15293d">Binary mask
    <tspan font-family="Georgia,'Times New Roman',serif" font-style="italic"> M</tspan>
  </text>
  <text x="260" y="741" text-anchor="middle" font-size="11" fill="#42566b">same shape as the input image</text>

  <!-- End -->
  <g filter="url(#m-shadow)">
    <rect x="200" y="774" width="120" height="34" rx="17" fill="url(#m-term)" stroke="#d19a28" stroke-width="1.4"/>
  </g>
  <text x="260" y="796" text-anchor="middle" font-size="13" font-weight="650" fill="#4a3208">End</text>
</svg>
