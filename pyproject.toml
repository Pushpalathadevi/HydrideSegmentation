[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydride-segmentation"
version = "1.0.0"
description = "Toolkit for zirconium hydride segmentation and analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "matplotlib",
    "opencv-python-headless",
    "scikit-image",
    "scikit-learn",
    "pillow",
    "h5py",
    "albumentations",
    "tqdm",
    "scipy",
    "torch",
    "segmentation-models-pytorch",
    "transformers",
    "huggingface_hub",
    "flask",
    "pydantic",
    "PyYAML",
    "xlsxwriter",
]

[project.optional-dependencies]
core = [
    "opencv-python-headless",
]
gui = [
    "PySide6",
]
web = [
    "waitress",
]
transformers = [
    "transformers",
    "huggingface_hub",
]

[tool.setuptools.package-data]
# Templates and static assets are served by the intranet web app and must ship
# with the installed package, not only from a source checkout.
#
# This is the list the build backend actually reads. setup.py carries a copy for
# anyone invoking it directly; keep the two in step.
"hydride_segmentation.web" = [
    "templates/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/img/*.svg",
    # Vendored KaTeX. The fonts must ship as well, or an installed copy renders
    # the help page mathematics in a fallback face on a host with no network.
    "static/vendor/katex/*.css",
    "static/vendor/katex/*.js",
    "static/vendor/katex/fonts/*.woff2",
    "static/vendor/katex/LICENSE",
    "static/vendor/katex/README.md",
]

[project.scripts]
hydride-gui = "hydride_segmentation.gui:main"
hydride-orientation = "hydride_segmentation.hydride_orientation_analyzer:main"
segmentation-eval = "hydride_segmentation.segmentation_evaluator:main"
hydride-service = "hydride_segmentation.service:main"
hydride-gui-qt = "hydride_segmentation.qt_gui:main"
microseg-web = "scripts.run_web_server:main"
microseg-docs = "scripts.build_docs:main"
microseg-cli = "scripts.microseg_cli:main"
microseg-phase-gate = "scripts.run_phase_gate:main"
microseg-benchmark-suite = "scripts.hydride_benchmark_suite:main"
prep-dataset = "src.microseg.data_preparation.cli:main"
