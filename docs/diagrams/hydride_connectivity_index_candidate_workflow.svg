<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Candidate Hydride Connectivity Index workflow and validation gates</title>
  <desc id="desc">A colored flow diagram showing mask preparation, component and graph analysis, candidate HCI calculation, and the scientific gates required before release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f9fc"/>
      <stop offset="1" stop-color="#e9f1f7"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9efff"/>
      <stop offset="1" stop-color="#b8ddf4"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7f4ed"/>
      <stop offset="1" stop-color="#a9dfd2"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eee5ff"/>
      <stop offset="1" stop-color="#d2bdf5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1cc"/>
      <stop offset="1" stop-color="#f3d38a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324a" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#35627d"/>
    </marker>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#163247}
      .subtitle{font:400 17px Arial,sans-serif;fill:#526c7e}
      .section{font:700 19px Arial,sans-serif;fill:#163247}
      .label{font:700 17px Arial,sans-serif;fill:#17364c}
      .body{font:400 14px Arial,sans-serif;fill:#355468}
      .small{font:400 12px Arial,sans-serif;fill:#4d6778}
      .gate{font:700 15px Arial,sans-serif;fill:#6c4300}
      .line{stroke:#35627d;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#9a6208;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1400" height="760" rx="24" fill="url(#bg)"/>
  <text x="70" y="60" class="title">Hydride Connectivity Index — Candidate Development Path</text>
  <text x="70" y="90" class="subtitle">Preserve the research idea, separate real and synthetic topology, and require scientific evidence before release.</text>

  <text x="70" y="145" class="section">Candidate computation</text>

  <g filter="url(#shadow)">
    <rect x="70" y="175" width="230" height="150" rx="18" fill="url(#blue)" stroke="#6ba7ca" stroke-width="2"/>
    <circle cx="105" cy="210" r="18" fill="#176b9c"/>
    <text x="99" y="216" font-family="Arial" font-size="17" font-weight="700" fill="#fff">1</text>
    <text x="135" y="215" class="label">Validated mask</text>
    <text x="95" y="250" class="body">• selected foreground classes</text>
    <text x="95" y="275" class="body">• scale and resize provenance</text>
    <text x="95" y="300" class="body">• deterministic cleanup</text>
  </g>

  <path d="M300 250 H350" class="line"/>

  <g filter="url(#shadow)">
    <rect x="350" y="175" width="250" height="150" rx="18" fill="url(#teal)" stroke="#53a990" stroke-width="2"/>
    <circle cx="385" cy="210" r="18" fill="#18745c"/>
    <text x="379" y="216" font-family="Arial" font-size="17" font-weight="700" fill="#fff">2</text>
    <text x="415" y="215" class="label">Component graph</text>
    <text x="375" y="250" class="body">• boundary distances</text>
    <text x="375" y="275" class="body">• explicit association edges</text>
    <text x="375" y="300" class="body">• connector crossings stay visual</text>
  </g>

  <path d="M600 250 H650" class="line"/>

  <g filter="url(#shadow)">
    <rect x="650" y="175" width="250" height="150" rx="18" fill="url(#violet)" stroke="#8f6bc7" stroke-width="2"/>
    <circle cx="685" cy="210" r="18" fill="#6f45ad"/>
    <text x="679" y="216" font-family="Arial" font-size="17" font-weight="700" fill="#fff">3</text>
    <text x="715" y="215" class="label">Skeleton graph</text>
    <text x="675" y="250" class="body">• collapsed junction regions</text>
    <text x="675" y="275" class="body">• weighted geodesic paths</text>
    <text x="675" y="300" class="body">• measured pruning policy</text>
  </g>

  <path d="M900 250 H950" class="line"/>

  <g filter="url(#shadow)">
    <rect x="950" y="175" width="380" height="150" rx="18" fill="#fff" stroke="#627d8e" stroke-width="2"/>
    <circle cx="985" cy="210" r="18" fill="#304e62"/>
    <text x="979" y="216" font-family="Arial" font-size="17" font-weight="700" fill="#fff">4</text>
    <text x="1015" y="215" class="label">Candidate HCI result</text>
    <text x="975" y="252" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#263e50">HCI = Σ Aᵢwᵢ / Σ Aᵢ</text>
    <text x="975" y="283" font-family="Georgia,serif" font-size="19" font-style="italic" fill="#263e50">wᵢ = ((Bᵢ + 1) / Nᵢ) (L̄primary / dmin,ᵢ)</text>
    <text x="975" y="308" class="small">Value + cluster table + artifacts + warnings + formulation ID</text>
  </g>

  <text x="70" y="390" class="section">Required evidence gates</text>

  <g filter="url(#shadow)">
    <rect x="70" y="420" width="270" height="165" rx="18" fill="url(#amber)" stroke="#c7922a" stroke-width="2"/>
    <text x="95" y="457" class="gate">A. Formulation lock</text>
    <text x="95" y="488" class="body">Define area, branching, length,</text>
    <text x="95" y="512" class="body">neighbour distance, single-cluster</text>
    <text x="95" y="536" class="body">behaviour, pruning, and units.</text>
    <rect x="95" y="552" width="200" height="22" rx="11" fill="#fff4d7"/>
    <text x="113" y="568" class="small">OWNER APPROVAL REQUIRED</text>
  </g>

  <path d="M340 502 H385" class="dash"/>

  <g filter="url(#shadow)">
    <rect x="385" y="420" width="270" height="165" rx="18" fill="url(#amber)" stroke="#c7922a" stroke-width="2"/>
    <text x="410" y="457" class="gate">B. Software verification</text>
    <text x="410" y="488" class="body">Synthetic graph tests, invariants,</text>
    <text x="410" y="512" class="body">CPU/memory limits, deterministic</text>
    <text x="410" y="536" class="body">GUI/CLI/web parity.</text>
    <rect x="410" y="552" width="190" height="22" rx="11" fill="#fff4d7"/>
    <text x="427" y="568" class="small">EXPERIMENTAL RELEASE</text>
  </g>

  <path d="M655 502 H700" class="dash"/>

  <g filter="url(#shadow)">
    <rect x="700" y="420" width="270" height="165" rx="18" fill="url(#amber)" stroke="#c7922a" stroke-width="2"/>
    <text x="725" y="457" class="gate">C. Scientific validation</text>
    <text x="725" y="488" class="body">Repeated fields, sensitivity sweeps,</text>
    <text x="725" y="512" class="body">expert ranking, uncertainty, and an</text>
    <text x="725" y="536" class="body">independent degradation outcome.</text>
    <rect x="725" y="552" width="195" height="22" rx="11" fill="#fff4d7"/>
    <text x="748" y="568" class="small">VALIDATION REPORT</text>
  </g>

  <path d="M970 502 H1015" class="dash"/>

  <g filter="url(#shadow)">
    <rect x="1015" y="420" width="315" height="165" rx="18" fill="#dff3e8" stroke="#3d9565" stroke-width="2"/>
    <text x="1040" y="457" class="label">D. Supported feature</text>
    <text x="1040" y="488" class="body">Versioned schema, calibrated units,</text>
    <text x="1040" y="512" class="body">auditable reports, documented failure</text>
    <text x="1040" y="536" class="body">modes, and approved promotion gate.</text>
    <rect x="1040" y="552" width="235" height="22" rx="11" fill="#f2fff7"/>
    <text x="1062" y="568" class="small">NOT YET AUTHORIZED</text>
  </g>

  <rect x="70" y="630" width="1260" height="74" rx="16" fill="#fff" stroke="#b8c8d3" stroke-width="2"/>
  <circle cx="110" cy="667" r="21" fill="#9a6208"/>
  <text x="103" y="674" font-family="Arial" font-size="22" font-weight="700" fill="#fff">!</text>
  <text x="150" y="660" class="label">Current state: development hold</text>
  <text x="150" y="685" class="body">Continue using validated area, size, orientation, and Fn metrics. Do not present HCI as a production or predictive engineering quantity.</text>
</svg>
